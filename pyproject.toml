[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solar-relay"
version = "0.1.0"
description = "Central multi-brand PV / hybrid inverter data relay (SunSpec, Modbus, Solarman, Sigen OpenAPI, vendor clouds -> InfluxDB / MQTT / Home Assistant / PVOutput)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
modbus   = ["pymodbus>=3.7"]
sunspec  = ["pysunspec2>=1.1"]
solarman = ["pysolarmanv5>=3.0"]
goodwe   = ["goodwe>=0.4"]
growatt  = ["growattServer>=1.5"]
sungrow  = ["cryptography>=42"]
sma      = ["sunnyportal>=0.0.5"]
mqtt     = ["paho-mqtt>=1.6,<2"]
influx   = ["influxdb-client>=1.40"]
all = [
    "pymodbus>=3.7", "pysunspec2>=1.1", "pysolarmanv5>=3.0", "goodwe>=0.4", "growattServer>=1.5",
    "cryptography>=42", "paho-mqtt>=1.6,<2", "influxdb-client>=1.40",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
solar-relay = "solar_relay.__main__:main"

[tool.setuptools.packages.find]
include = ["solar_relay*"]

[tool.setuptools.package-data]
solar_relay = ["alarm_catalog.yaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
