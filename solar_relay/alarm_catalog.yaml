# Unified alarm / error-code catalog.  See alarm_catalog.py for the lookup rules.
# action = คำแนะนำสำหรับทีมบริการ (ไทย), name/cause = English so the vendor manual is easy to cross-reference.
# Sources: Huawei SUN2000 Modbus Interface Definitions + FusionSolar alarm reference; Solis / Ginlong user manuals (fault list);
# Sungrow SG/SH user manuals; Deye SUN-xK-SG0xLP1/3 manual (F-codes); Sofar HYD manual (ID codes); SolaX X1/X3 hybrid manual (IE codes);
# GoodWe ET/EH manual (error list, same names as the goodwe PyPI lib); Fronius Symo/Primo state codes; SMA event numbers;
# SolarEdge SetApp error codes; SunSpec model 101-103 Evt1 bits; Sigenergy OpenAPI Alarm push (alarmCode) - fill the Sigen list
# from the portal "Error Code List" page once your vendor account can open it.

_default:
  name: Unknown alarm
  severity: warning
  action: ยังไม่มีในตาราง ให้จดรหัสจากหน้าจอ/แอปของผู้ผลิต ตรวจว่า alarm ยัง active หรือไม่ แล้วเพิ่มรหัสลง alarm_catalog.yaml

categories:
  grid_loss:
    name: Grid loss / no AC
    severity: warning
    cause: ไฟกริดดับ, เบรกเกอร์ AC ตัด, สายเฟส/นิวทรัลหลวม, ฟิวส์ AC ขาด
    action: ตรวจว่ากริดมีไฟหรือไม่ วัดแรงดันที่ขั้ว AC ของ inverter ตรวจเบรกเกอร์ AC และจุดต่อสาย ถ้ากริดมีไฟแต่ยังฟ้อง ให้ตรวจสาย N ขาดหรือ RCD ตัด
  grid_overvoltage:
    name: Grid overvoltage
    severity: warning
    cause: แรงดันกริดสูงเกิน setting ประเทศ (มักเกิดช่วงเที่ยงที่ระบบใกล้เคียง export มาก) หรือสาย AC ยาว/เล็กทำให้แรงดันปลายสายยกขึ้น
    action: วัดแรงดันกริดที่ขั้ว inverter เทียบ setting (ไทย 220/380 V ±10%) ถ้าเกิดเฉพาะช่วงผลิตสูง ให้ลดค่า impedance ของสาย AC (เพิ่มขนาดสาย/ลดระยะ) หรือเปิดฟังก์ชัน Volt-Watt/Q(U) ตามข้อกำหนดการไฟฟ้า อย่าปรับ protection limit เกินที่การไฟฟ้าอนุญาต
  grid_undervoltage:
    name: Grid undervoltage
    severity: warning
    cause: แรงดันกริดต่ำ, สาย AC หลวม, โหลดหนักในซอย, เฟสหาย
    action: วัดแรงดันกริดทุกเฟส ตรวจจุดต่อสายและเบรกเกอร์ ถ้าแรงดันจากการไฟฟ้าต่ำจริงให้แจ้งการไฟฟ้า
  grid_frequency:
    name: Grid frequency out of range
    severity: warning
    cause: ความถี่กริดเกิน/ต่ำกว่าช่วงที่ตั้ง (ไทย 50 Hz ±1) หรือเป็นระบบ off-grid/เจนเนอเรเตอร์ที่ความถี่แกว่ง
    action: ถ้าเกิดชั่วคราวและกลับมาเองไม่ต้องทำอะไร ถ้าเกิดซ้ำให้ตรวจ grid code ที่ตั้งใน inverter และตรวจว่าจ่ายไฟจากเจนเนอเรเตอร์หรือไม่
  grid_impedance:
    name: Grid impedance too high
    severity: warning
    cause: สาย AC ยาว/เล็ก จุดต่อหลวม หม้อแปลงขนาดเล็ก
    action: ตรวจจุดต่อ AC ทุกจุด เพิ่มขนาดสายหรือลดระยะ ปรับค่า impedance protection ได้เฉพาะเมื่อการไฟฟ้าอนุญาต
  islanding:
    name: Islanding detected
    severity: warning
    cause: inverter ตรวจพบว่ากริดหาย (anti-islanding) มักเกิดพร้อมกริดดับหรือกริดอ่อนมาก
    action: ปกติจะต่อกริดใหม่เองเมื่อกริดปกติ ถ้าเกิดบ่อยทั้งที่กริดปกติ ให้ตรวจสาย AC และ grid code ที่ตั้ง
  dc_overvoltage:
    name: PV / DC overvoltage
    severity: fault
    cause: จำนวนแผงต่ออนุกรมมากเกินไป (Voc รวมสูงกว่า Vmax ของ inverter) โดยเฉพาะตอนเช้าอากาศเย็น
    action: วัด Voc ของ string ตอนเช้า เทียบกับ Max DC voltage ของ inverter ถ้าเกินให้ลดจำนวนแผงต่อ string ห้ามเปิดเครื่องซ้ำจนกว่าจะแก้
  dc_reverse:
    name: PV string reverse polarity
    severity: fault
    cause: ต่อขั้ว +/- ของ string สลับ
    action: ปิด DC switch วัดขั้วทุก string ด้วยมิเตอร์ แล้วสลับสายให้ถูก
  string_abnormal:
    name: String current / power abnormal
    severity: warning
    cause: string ใดผลิตต่ำผิดปกติ (เงาบัง แผงเสีย ฟิวส์ขาด คอนเนกเตอร์ MC4 ร้อน/หลวม)
    action: เทียบกระแสแต่ละ string ในแอป/dashboard (PV strings panel) string ที่ต่ำกว่าเพื่อนเกิน 20% ให้ตรวจเงาบัง คอนเนกเตอร์ MC4 ฟิวส์ และแผงด้วยกล้องความร้อน
  string_backfeed:
    name: String current backfeed
    severity: warning
    cause: string มี Voc ไม่เท่ากัน (จำนวนแผงต่างกัน หรือมีแผงเสีย) ทำให้กระแสไหลย้อน
    action: ตรวจว่าทุก string ที่ขนานกันมีจำนวนแผงและรุ่นเท่ากัน วัด Voc แต่ละ string
  insulation:
    name: Low insulation resistance (ISO / PV ground fault)
    severity: fault
    cause: ฉนวนสาย DC รั่วลงดิน (สายถลอก, น้ำเข้ากล่องต่อสาย/MC4, ความชื้นตอนเช้า, แผงแตก)
    action: ปิดเครื่อง วัดค่าฉนวน (Riso) ของแต่ละ string เทียบดิน ด้วย insulation tester 1000 V ต้อง > 1 MΩ ถ้าเกิดเฉพาะตอนเช้าชื้นแล้วหาย ให้ตรวจกล่อง junction/MC4 ที่มีน้ำเข้า ค่าที่ต่ำถาวรให้ไล่หาสายที่ถลอกหรือแผงรั่ว
  leakage:
    name: Residual / leakage current too high (RCMU, GFCI)
    severity: fault
    cause: กระแสรั่วลงดินฝั่ง DC หรือ AC เกิน 30-300 mA, capacitance ต่อดินของแผงสูง (แผงเปียก), RCD ที่ติดตั้งไม่ใช่ type A/B
    action: ตรวจฉนวนสาย DC และการต่อดินของโครงแผง ถ้าเกิดตอนฝนตกแล้วหายเป็นเรื่อง capacitance ปกติของ array ใหญ่ ถ้าเกิดถาวรให้ตรวจ AC wiring และ RCD ห้าม bypass sensor
  arc:
    name: DC arc fault (AFCI)
    severity: fault
    cause: จุดต่อ DC หลวม/ไหม้ (MC4, ขั้วต่อใน inverter, ฟิวส์) ทำให้เกิดประกายไฟ เสี่ยงไฟไหม้
    action: ห้าม reset ซ้ำโดยไม่ตรวจ ปิด DC switch แล้วตรวจ MC4 ทุกจุด สายที่ร้อน/ดำ ขั้วต่อใน inverter และกล่อง combiner ถ้าเป็น false alarm ซ้ำให้ทดสอบ AFCI self-test และอัปเดต firmware
  overtemp:
    name: Over temperature
    severity: warning
    cause: ระบายความร้อนไม่พอ (ติดตั้งโดนแดด, ระยะห่างไม่พอ, ฝุ่นอุดครีบ, พัดลมเสีย) หรืออุณหภูมิแวดล้อมสูง
    action: ตรวจว่า inverter ไม่โดนแดดตรง มีระยะห่างตามคู่มือ ทำความสะอาดครีบระบายความร้อนและพัดลม ถ้า derating ตอนบ่ายเป็นประจำให้เพิ่มการระบายอากาศหรือย้ายตำแหน่ง
  fan:
    name: Fan failure
    severity: warning
    cause: พัดลมภายใน/ภายนอกเสียหรือติดฝุ่น
    action: ปิดเครื่อง ทำความสะอาดพัดลม ถ้าไม่หมุนให้เปลี่ยนพัดลม (อะไหล่จากผู้ผลิต)
  relay:
    name: Relay / output relay check failure
    severity: fault
    cause: รีเลย์ต่อกริดภายในเสีย หรือมีไฟย้อนที่ขั้ว AC ตอนตรวจ
    action: ปิดเปิดเครื่องใหม่ 1 ครั้ง ถ้ายังฟ้องเป็นความเสียหายภายใน ติดต่อผู้ผลิตเคลม
  dc_injection:
    name: DC component in AC output too high
    severity: fault
    cause: วงจรภายในผิดปกติ หรือมี DC offset จากโหลด/กริด
    action: ปิดเปิดเครื่องใหม่ ถ้าเกิดซ้ำติดต่อผู้ผลิต
  bus:
    name: DC bus voltage abnormal
    severity: fault
    cause: บัสภายในแรงดันสูง/ต่ำผิดปกติ มักตามหลัง DC overvoltage หรือแผงแรงดันแกว่ง
    action: ตรวจ Voc ของ string และการต่อสาย DC ปิดเปิดใหม่ ถ้าเกิดซ้ำติดต่อผู้ผลิต
  overcurrent:
    name: Output / input overcurrent
    severity: fault
    cause: กระแส AC หรือ DC เกินพิกัด (โหลด backup เกิน, string ขนานมากไป, กริดผิดปกติชั่วขณะ)
    action: ตรวจว่า string ขนานไม่เกิน Isc ที่ inverter รับได้ ลดโหลดฝั่ง backup ถ้าเกิดซ้ำติดต่อผู้ผลิต
  overload:
    name: Backup / EPS overload
    severity: warning
    cause: โหลดในวงจร backup เกินพิกัดของ inverter ตอนไฟดับ หรือโหลดมอเตอร์กระชากตอนสตาร์ท
    action: ลดโหลดในวงจร backup ให้ต่ำกว่าพิกัด ย้ายมอเตอร์/แอร์ใหญ่ออกจากวงจร backup
  battery:
    name: Battery abnormal
    severity: fault
    cause: BMS รายงานผิดปกติ (แรงดันเซลล์สูง/ต่ำ, อุณหภูมิ, กระแสเกิน) หรือแบตเตอรี่ต่อสลับขั้ว
    action: ดูรหัสของ BMS ในแอป ตรวจเบรกเกอร์แบตเตอรี่และขั้วต่อ ถ้า SOC ต่ำมากให้ปล่อยชาร์จจากกริด ถ้าเป็นแรงดันเซลล์ผิดปกติให้ติดต่อผู้ผลิตแบตเตอรี่
  battery_comm:
    name: Battery / BMS communication lost
    severity: fault
    cause: สาย CAN/RS485 ระหว่าง inverter กับแบตเตอรี่หลุด สลับ pin ตั้ง protocol ผิดรุ่น หรือ terminator ไม่ครบ
    action: ตรวจสาย comm ขั้วต่อ pinout ตามคู่มือแบตเตอรี่รุ่นนั้น ตั้งค่า battery brand/protocol ใน inverter ให้ตรง เปิดแบตก่อนเปิด inverter
  battery_reverse:
    name: Battery reverse connection
    severity: fault
    cause: ต่อขั้วแบตเตอรี่สลับ
    action: ปิดทุกอย่าง ตรวจขั้ว +/- ก่อนต่อใหม่ ตรวจว่าฟิวส์/เบรกเกอร์แบตยังดี
  meter_comm:
    name: Meter / CT communication abnormal
    severity: warning
    cause: สาย RS485 ไปมิเตอร์หลุด, address/baud ผิด, CT ต่อสลับทิศหรือหลุด
    action: ตรวจสาย A/B ของ RS485 ที่มิเตอร์ ตั้ง address และ baud ตามคู่มือ ตรวจทิศ CT (ลูกศรชี้ไปทางกริด) ถ้ามิเตอร์หายจะทำให้ zero-export ไม่ทำงาน
  comm:
    name: Communication / monitoring unit fault
    severity: info
    cause: datalogger/dongle หลุดจากอินเทอร์เน็ต หรือสายภายในหลวม
    action: ตรวจ Wi-Fi/LAN ของ dongle ถอดเสียบใหม่ ตรวจว่า inverter ยังผลิตปกติ (alarm นี้ไม่กระทบการผลิต)
  device_fault:
    name: Internal device / hardware fault
    severity: fault
    cause: ความเสียหายภายใน (sensor, DSP, power stage)
    action: ปิดเครื่องทั้ง AC/DC รอ 5 นาที เปิดใหม่ 1 ครั้ง ถ้ายังฟ้องให้จดรหัสและ serial แล้วเปิดเคลมกับผู้ผลิต อย่าซ่อมเอง
  firmware:
    name: Firmware / upgrade / license problem
    severity: info
    cause: อัปเดตไม่สำเร็จ เวอร์ชันไม่ตรงกัน หรือ license หมดอายุ
    action: อัปเดต firmware ใหม่ผ่านแอปผู้ติดตั้ง หรือติดต่อผู้ผลิตเรื่อง license
  config:
    name: Configuration abnormal
    severity: warning
    cause: ตั้งค่าไม่ตรงกับการติดตั้งจริง (grid code, PV string config, CT, meter, battery type)
    action: ตรวจการตั้งค่าใน commissioning app ให้ตรงกับหน้างาน
  pv_low:
    name: PV voltage low / no PV
    severity: info
    cause: แสงน้อย เช้า-เย็น หรือ string หลุด/DC switch ปิด
    action: ถ้าเกิดเฉพาะเช้า-เย็นเป็นปกติ ถ้าเกิดกลางวันให้ตรวจ DC switch ฟิวส์ และคอนเนกเตอร์
  optimizer:
    name: Optimizer / module-level device fault
    severity: warning
    cause: optimizer หรืออุปกรณ์ระดับแผงหลุดสื่อสาร/เสีย
    action: ดูแผงที่หายจากแผนผังในแอป ตรวจคอนเนกเตอร์และตัว optimizer ตัวนั้น

brands:
  # =========================================================================== HUAWEI SUN2000 (alarm ID = FusionSolar alarmId)
  huawei:
    "2001": {name: High string input voltage, category: dc_overvoltage}
    "2002": {name: DC arc fault, category: arc}
    "2003": {name: DC arc fault (manual clear required), category: arc, action: เหมือน 2002 และต้อง clear alarm ด้วยแอป/ปุ่มบนเครื่องหลังตรวจสายเสร็จ}
    "2011": {name: String reverse connection, category: dc_reverse}
    "2012": {name: String current backfeed, category: string_backfeed}
    "2013": {name: Abnormal string power, category: string_abnormal}
    "2014": {name: High input string voltage to ground, category: insulation}
    "2015": {name: PV string loss, category: pv_low, action: string นั้นไม่มีกระแสกลางวัน ตรวจ MC4 ฟิวส์ และแผง}
    "2021": {name: AFCI self-check fail, category: arc, action: รัน AFCI self-check ใหม่จากแอป ถ้าล้มเหลวซ้ำเป็นบอร์ด AFCI เสีย เคลม}
    "2031": {name: Phase wire short-circuited to PE, category: grid_loss, action: สายเฟสช็อตลงดินหรือต่อ N/PE ผิด ตรวจ AC wiring ทั้งหมดก่อนเปิดใหม่, severity: fault}
    "2032": {name: Grid loss, category: grid_loss}
    "2033": {name: Grid undervoltage, category: grid_undervoltage}
    "2034": {name: Grid overvoltage, category: grid_overvoltage}
    "2035": {name: Grid voltage imbalance, category: grid_undervoltage, action: วัดแรงดัน 3 เฟส ต่างกันเกิน 3-5% แสดงว่าโหลดไม่สมดุลหรือสายเฟสหลวม}
    "2036": {name: Grid overfrequency, category: grid_frequency}
    "2037": {name: Grid underfrequency, category: grid_frequency}
    "2038": {name: Unstable grid frequency, category: grid_frequency}
    "2039": {name: Output overcurrent, category: overcurrent}
    "2040": {name: Output DC component overhigh, category: dc_injection}
    "2051": {name: Abnormal residual current, category: leakage}
    "2061": {name: Abnormal grounding, category: insulation, action: ตรวจว่าสาย PE ต่อครบและมีความต่อเนื่อง สาย N/PE ไม่สลับ}
    "2062": {name: Low insulation resistance, category: insulation}
    "2063": {name: Overtemperature, category: overtemp}
    "2064": {name: Device fault, category: device_fault}
    "2065": {name: Upgrade failed or version mismatch, category: firmware}
    "2066": {name: License expired, category: firmware}
    "2067": {name: Faulty power collector, category: meter_comm}
    "2068": {name: Battery abnormal, category: battery}
    "2069": {name: Battery reverse connection, category: battery_reverse}
    "2070": {name: Active islanding, category: islanding}
    "2071": {name: Passive islanding, category: islanding}
    "2072": {name: Transient AC overvoltage, category: grid_overvoltage}
    "2075": {name: Peripheral port short circuit, category: device_fault, action: ตรวจสายที่ต่อพอร์ต COM/12V/dry contact ว่าช็อตหรือไม่}
    "2077": {name: Abnormal grounding or AC wiring, category: insulation}
    "2080": {name: Abnormal PV module configuration, category: config}
    "2081": {name: Optimizer fault, category: optimizer}
    "2082": {name: On-grid/off-grid controller abnormal, category: device_fault}
    "2085": {name: Built-in PID operation abnormal, category: device_fault}
    "2086": {name: External fan abnormal, category: fan}
    "2087": {name: Internal fan abnormal, category: fan}
    "2088": {name: DC protection unit abnormal, category: device_fault}
    "2089": {name: EL unit abnormal, category: device_fault}
    "2090": {name: Active adjustment instruction abnormal, category: config}
    "2091": {name: Reactive adjustment instruction abnormal, category: config}
    "2092": {name: CT wiring abnormal, category: meter_comm}
    "61440": {name: Faulty monitoring unit, category: comm}
    _default: {name: Huawei alarm, action: ดูรายละเอียดใน FusionSolar > Alarms ซึ่งมี alarmCause และ repairSuggestion ของ Huawei}

  # =========================================================================== SOLIS (Ginlong) - fault text codes on display / SolisCloud
  solis:
    "NO-GRID": {name: No grid, category: grid_loss, aliases: [No Grid, NoGrid]}
    "OV-G-V": {name: Grid overvoltage, category: grid_overvoltage, aliases: [OV-G-V01, OV-G-V02, OV-G-V03, OV-G-V04, OV-G-V05]}
    "UN-G-V": {name: Grid undervoltage, category: grid_undervoltage, aliases: [UN-G-V01, UN-G-V02, UN-G-V03]}
    "OV-G-F": {name: Grid overfrequency, category: grid_frequency, aliases: [OV-G-F01, OV-G-F02]}
    "UN-G-F": {name: Grid underfrequency, category: grid_frequency, aliases: [UN-G-F01, UN-G-F02]}
