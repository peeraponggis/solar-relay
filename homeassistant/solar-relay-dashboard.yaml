# generated by homeassistant/build_dashboard.py - do not edit by hand
title: Solar Relay
views:
- title: Overview
  path: overview
  icon: mdi:view-dashboard
  cards:
  - type: markdown
    content: '## ☀️ Solar Relay

      {% set devs = [''binary_sensor.solaredge_main_alarm'', ''binary_sensor.fronius_gen24_alarm'', ''binary_sensor.sma_tripower_alarm'',
      ''binary_sensor.delta_rpi_alarm'', ''binary_sensor.huawei_sun2000_alarm'', ''binary_sensor.solis_s6_hybrid_alarm'',
      ''binary_sensor.sungrow_sh10rt_alarm'', ''binary_sensor.solax_x3_hybrid_alarm'', ''binary_sensor.sigen_plant_local_alarm'',
      ''binary_sensor.deye_house_alarm'', ''binary_sensor.sofar_hyd_alarm'', ''binary_sensor.solis_dlsw_alarm'', ''binary_sensor.goodwe_et_alarm'']
      %}{% set on = devs | select(''is_state'', ''on'') | list | length %}{% set off = devs | select(''is_state'', ''unavailable'')
      | list | length %}อุปกรณ์ 13 เครื่อง · ⚠️ alarm {{ on }} · 📴 offline {{ off }}'
  - type: grid
    columns: 2
    square: false
    cards:
    - type: vertical-stack
      cards:
      - type: tile
        entity: sensor.solaredge_main_status
        name: solaredge-main
        icon: mdi:solar-power-variant
        tap_action:
          action: navigate
          navigation_path: /solar-relay/solaredge_main
      - type: horizontal-stack
        cards:
        - type: tile
          entity: sensor.solaredge_main_pv_w
          name: PV
          vertical: true
          icon: mdi:solar-power
        - type: tile
          entity: sensor.solaredge_main_load_w
          name: Load
          vertical: true
          icon: mdi:home-lightning-bolt
        - type: tile
          entity: sensor.solaredge_main_grid_w
          name: Grid
          vertical: true
          icon: mdi:transmission-tower
        - type: tile
          entity: sensor.solaredge_main_batt_w
          name: Battery
          vertical: true
          icon: mdi:battery-charging
      - type: horizontal-stack
        cards:
        - type: gauge
          entity: sensor.solaredge_main_soc
          name: SOC
          min: 0
          max: 100
          needle: true
          severity:
            red: 0
            yellow: 20
            green: 50
        - type: entities
          entities:
          - entity: sensor.solaredge_main_energy_day_kwh
            name: PV today
          - entity: sensor.solaredge_main_load_day_kwh
            name: Load today
          - entity: binary_sensor.solaredge_main_alarm
            name: Alarm
      - type: conditional
        conditions:
        - condition: state
          entity: binary_sensor.solaredge_main_alarm
          state: 'on'
        card:
          type: markdown
          content: "### Alarm · solaredge-main\n{% set ns = namespace(n=0) %}\n{% for a in (state_attr('sensor.solaredge_main_alarms',\
            \ 'alarms') or []) if a.active %}\n{% set ns.n = ns.n + 1 %}\n**solaredge-main** · `{{ a.code }}` {{ a.message\
            \ }}  \n{% if a.advice %}➜ {{ a.advice }}{% endif %}\n\n{% endfor %}\n{% if ns.n == 0 %}✅ ไม่มี alarm ค้าง{% endif\
            \ %}"
