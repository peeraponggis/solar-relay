name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .
      - name: Test
        run: pytest -q --junitxml=pytest-${{ matrix.python }}.xml
      - name: Generated files are in sync
        run: |
          python grafana/build_dashboard.py
          python homeassistant/build_dashboard.py
          python -m solar_relay.alarm_catalog --markdown > docs/ALARM_CODES.md
          git diff --exit-code -- grafana homeassistant docs || (echo "::error::regenerate dashboards/docs and commit" && exit 1)
      - name: CLI smoke
        run: |
          python -m solar_relay --list-adapters
          cp config.example.yaml /tmp/cfg.yaml
          set -a; cp .env.example /tmp/.env; . /tmp/.env; set +a
          INFLUX_TOKEN=x python -c "from solar_relay.config import RelayConfig; c=RelayConfig.load('/tmp/cfg.yaml'); print(len(c.devices), 'devices', len(c.outputs), 'outputs')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-${{ matrix.python }}
          path: pytest-${{ matrix.python }}.xml
